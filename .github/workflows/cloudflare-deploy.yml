name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Blog posts are pre-rendered at build time (static export), so a post published in the
  # CMS needs a rebuild before its page exists. The schedule rebuilds production whenever
  # the CMS content differs from what the live site was built with.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # Lets the CMS repo trigger an immediate rebuild:
  #   POST /repos/adamsuk/sradams-co-uk-content/dispatches {"event_type": "blog-published"}
  repository_dispatch:
    types: [blog-published]

env:
  CMS_URL: https://blog.sradams.co.uk/api
  SITE_URL: https://sradams.co.uk

jobs:
  check-content:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare CMS content with the live build
        id: compare
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! cms=$(curl -fsS --retry 3 "$CMS_URL/blog" | jq -cS . | sha256sum | cut -d' ' -f1); then
            echo "CMS unreachable; skipping this run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=$(curl -fsS --retry 3 "$SITE_URL/cms-content.sha256" | tr -d '[:space:]' || true)
          echo "CMS: $cms  live: ${live:-<none>}"
          if [ "$cms" = "$live" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-content
    if: needs.check-content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get no Actions secrets and a read-only GITHUB_TOKEN, so
    # they test and build only: the Cloudflare preview, GitHub Deployment and PR comment
    # steps are skipped for github.actor dependabot[bot]. Once merged, the auto-merge
    # workflow dispatches this workflow on main to deploy production.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage -- --json --outputFile=test-results.json

      - name: Comment test and coverage summary on PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');

            // Parse test results
            let testSummary = '';
            try {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const {
                numPassedTests, numFailedTests, numTotalTests,
                numPassedTestSuites, numTotalTestSuites,
              } = results;
              const icon = numFailedTests === 0 ? '✅' : '❌';
              testSummary = `${icon} **${numPassedTests}/${numTotalTests}** tests passed across **${numPassedTestSuites}/${numTotalTestSuites}** suites`;
            } catch (e) {
              testSummary = '⚠️ Could not parse test results';
            }

            // Parse coverage summary
            let coverageTable = '';
            try {
              const summary = JSON.parse(
                fs.readFileSync('coverage/coverage-summary.json', 'utf8')
              ).total;
              const fmt = (m) => `${m.pct}% (${m.covered}/${m.total})`;
              coverageTable = [
                '| Metric | Coverage |',
                '|--------|----------|',
                `| Statements | ${fmt(summary.statements)} |`,
                `| Branches   | ${fmt(summary.branches)} |`,
                `| Functions  | ${fmt(summary.functions)} |`,
                `| Lines      | ${fmt(summary.lines)} |`,
              ].join('\n');
            } catch (e) {
              coverageTable = '⚠️ Could not parse coverage report';
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🧪 Test Results\n\n${testSummary}\n\n### 📊 Coverage Report\n\n${coverageTable}`,
            });

      - name: Snapshot CMS content hash
        run: |
          curl -fsS --retry 3 "$CMS_URL/blog" | jq -cS . | sha256sum | cut -d' ' -f1 \
            > cms-content.sha256 || echo "unavailable" > cms-content.sha256
          cat cms-content.sha256

      - name: Build
        run: npm run build

      - name: Publish CMS content hash
        run: cp cms-content.sha256 out/cms-content.sha256

      - name: Create GitHub Deployment
        if: github.actor != 'dependabot[bot]'
        id: deployment
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: context.eventName === 'pull_request' ? 'preview' : 'production',
              auto_merge: false,
              required_contexts: [],
              description: context.eventName === 'pull_request' 
                ? `Deploy PR #${context.payload.pull_request.number}` 
                : 'Deploy to production'
            });
            return deployment.data.id;

      - name: Publish to Cloudflare Pages
        if: github.actor != 'dependabot[bot]'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - name: Update Deployment Status (Success)
        if: success() && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          CLOUDFLARE_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          CLOUDFLARE_ALIAS: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const deploymentId = process.env.DEPLOYMENT_ID;
            const cloudflareUrl = process.env.CLOUDFLARE_URL || process.env.CLOUDFLARE_ALIAS;
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: cloudflareUrl,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployment successful'
            });

      - name: Update Deployment Status (Failure)
        if: failure() && steps.deployment.outputs.result
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
        with:
          script: |
            const deploymentId = process.env.DEPLOYMENT_ID;
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployment failed'
            });

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success() && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          CLOUDFLARE_ALIAS: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const deployUrl = process.env.CLOUDFLARE_ALIAS || process.env.CLOUDFLARE_URL;
            const uniqueUrl = process.env.CLOUDFLARE_URL;
            if (deployUrl) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  '## 🚀 Cloudflare Pages Preview Deployment',
                  '',
                  `**Preview URL:** ${deployUrl}`,
                  uniqueUrl && uniqueUrl !== deployUrl ? `**Unique deployment URL:** ${uniqueUrl}` : '',
                  '',
                  'Deployed successfully!',
                ].filter(line => line !== undefined && !(line === '' && false)).join('\n'),
              });
            }
