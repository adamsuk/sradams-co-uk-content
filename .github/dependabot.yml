# Weekly version updates for npm (the only package.json/lockfile is at the root) and
# GitHub Actions. Mirrors touchlineHQ/clubsPlatform's conventions: grouped families that
# must move together, and framework majors held back for a manual upgrade.
# Dependabot PRs within policy (patch/minor only) are merged by
# .github/workflows/dependabot-auto-merge.yml once CI is green; majors and GitHub Actions
# bumps stay manual. Groups only collect patch/minor updates, so a major always arrives
# as its own PR instead of turning a whole group into a major.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      next:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types: ["minor", "patch"]
      testing:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "@types/jest"
          - "@testing-library/*"
        update-types: ["minor", "patch"]
      eslint:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "eslint-config-airbnb*"
          - "@typescript-eslint/*"
        update-types: ["minor", "patch"]
      css:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
        update-types: ["minor", "patch"]
      markdown:
        patterns:
          - "react-markdown"
          - "rehype-*"
          - "remark-*"
        update-types: ["minor", "patch"]
    ignore:
      # Framework majors need a deliberate migration (static export, Tailwind v4 config,
      # React 19, ESLint flat config); tests and the build would not catch every break.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
